version: 2
updates:
  - package-ecosystem: bun
    directories: [/, /k6]
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
