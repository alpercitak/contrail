name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    # API search tests run against this Redis (database 15); keep the tag in step with docker-compose.yml.
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - run: bun install

      - run: bun run check

      - uses: alpercitak/fasttrack@v0
        with:
          args: --build --typecheck --test --verbose
