# Docker's DNS; re-resolve so a recreated api or gateway-lb is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
  zone api 64k;
  server api:3002 resolve;
}

upstream gateway-lb {
  zone gateway-lb 64k;
  server gateway-lb:80 resolve;
}

server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /api {
    proxy_pass http://api;
  }

  location /ws {
    proxy_pass http://gateway-lb;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
